<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script src="js/core/util.js"></script>
<script src="js/data/base.js"></script>
<script src="js/data/cities.js"></script>
<script src="js/art/paint.js"></script>
<script src="js/art/city.js"></script>
<script>
const q=new URLSearchParams(location.search);
window.onload=()=>{ try{
  const id=+(q.get('city')||0); const city=G.CITY_DATA[id];
  const t0=performance.now();
  const sc=G.Art.cityScene(city,{time:q.get('time')||'day', flag:q.get('flag')||'#1d3f7a'});
  document.getElementById('c').getContext('2d').drawImage(sc,0,0);
  document.title='done '+(performance.now()-t0).toFixed(0);
 }catch(e){document.title='err '+e.message;console.error(e)} };
</script></body></html>
