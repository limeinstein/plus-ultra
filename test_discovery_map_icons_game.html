<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>유적·자연 경관 지도 아이콘 시험</title>
<style>html,body{margin:0;overflow:hidden;background:#08151c}iframe{width:1600px;height:900px;border:0;display:block}</style></head>
<body><iframe id="game" src="index.html"></iframe><script>
document.getElementById('game').onload = async function () {
  try {
    var G = this.contentWindow.G, lg = G.LANGS.map(function () { return 0; }), sk = {}, i;
    G.SKILLS.forEach(function (x) { sk[x.id] = 0; }); sk.nav = 2; sk.survey = 2; sk.hist = 2;
    var s = G.State.newGame({ name:'유적 시험 제독', nation:'PT', job:'explorer', age:22, birth:{m:4,d:12}, st:{str:58,int:50,mar:55,cha:52}, sk:sk, lg:lg, diff:'normal', gold:3000 });
    G.Game.state = s; s.settings.res = 0.35;
    ['stonehenge', 'poitiers', 'troy', 'parthenon', 'pamukkale', 'gibraltar', 'seongsan', 'reef', 'solomon', 'icebergs', 'milkysea', 'vesuvius'].forEach(function (id) { s.disc[id] = { found:true, me:true }; });
    s.disc.huangshan = { found:true, me:false, rival:true };
    s.hints.uluru = { source:'소문' };
    var visible = G.DiscoveryIcon.visible().map(function (d) { return d.id; }).sort();
    if (G.DiscoveryIcon.count() !== 98 || visible.join(',') !== 'gibraltar,icebergs,milkysea,pamukkale,poitiers,reef,seongsan,solomon,stonehenge,troy') throw new Error('지도 발견물 포함·제외 규칙이 맞지 않습니다: ' + visible.join(','));
    var naturals = G.DISCOVERIES.filter(function (d) { return (d.cat === 'nature' || d.natural) && (d.how === 'land' || d.how === 'sea'); });
    if (naturals.length !== 46 || !naturals.every(G.DiscoveryIcon.isMapLandmark)) throw new Error('자연 경관 지도 아이콘이 빠졌습니다.');
    await G.DiscoveryIcon.preload(G.DiscoveryIcon.visible().concat(naturals));
    var keys = ['map-discoveries/ruins-1', 'map-discoveries/ruins-3', 'map-discoveries/nature-1', 'map-discoveries/nature-2', 'map-discoveries/nature-3'];
    if (!keys.every(function (k) { return !!G.Img.get(k); })) throw new Error('지도 발견물 시트를 읽지 못했습니다.');
    var cv = this.contentDocument.createElement('canvas'), cx = cv.getContext('2d'); cv.width = cv.height = 64;
    cx.drawImage(G.Img.get(keys[0]), 0, 0, 64, 64);
    var alpha = cx.getImageData(0, 0, 64, 64).data, clear = false, solid = false;
    for (i = 3; i < alpha.length; i += 4) { if (!alpha[i]) clear = true; if (alpha[i] > 200) solid = true; }
    if (!clear || !solid) throw new Error('지도 유적 시트의 투명 알파가 없습니다.');
    naturals.forEach(function (d) {
      cx.clearRect(0, 0, 64, 64); G.DiscoveryIcon.draw(cx, d, 32, 32);
      var pixels = cx.getImageData(0, 0, 64, 64).data, opaque = 0;
      for (var j = 3; j < pixels.length; j += 4) if (pixels[j] > 200) opaque++;
      if (opaque < 40 || pixels[3]) throw new Error('자연 경관 아이콘이 비어 있거나 투명하지 않습니다: ' + d.id);
    });
    var hit = G.DiscoveryIcon.at([G.DISC.gibraltar], function () { return [100, 100]; }, 100, 100, 1);
    if (!hit || hit.id !== 'gibraltar') throw new Error('자연 경관 클릭 위치가 맞지 않습니다.');
    await G.Game.ensureGeo();
    var view = new URLSearchParams(location.search).get('view') || 'chart';
    if (view === 'sea') {
      G.Game.go('sea', { depart:8 });
      s.loc.lon = -6.1; s.loc.lat = 35.7;
      var sea = G.Scenes.sea.runtime(); sea.paused = true;
      sea.cam.lon = s.loc.lon; sea.cam.lat = s.loc.lat;
      sea.mouse = G.Scenes.sea.toScreen(G.DISC.gibraltar.lon, G.DISC.gibraltar.lat);
      setTimeout(function () { document.title = 'discovery done'; }, 1200);
      return;
    }
    var base = G.CITY_DATA.filter(function (c) { return c.name === '이스탄불'; })[0] || G.CITY_DATA[0];
    if (s.known.indexOf(base.id) < 0) s.known.push(base.id);
    s.loc = { mode:'land', lon:28.6, lat:38.4, heading:0, base:{ type:'city', city:base.id, lon:base.lon, lat:base.lat }, party:18, days:0, party0:18, found0:2, marks0:0, mount:{id:'walk',n:0} };
    G.Game.go('land', { resume:true });
    var rt = G.Scenes.land.runtime(); if (rt) { rt.cam.zoom = 130; rt.cam.zoomT = 130; }
    setTimeout(function () {
      if (view === 'land') { document.title = 'discovery done'; return; }
      var host = document.getElementById('game').contentDocument.createElement('div');
      host.style.cssText = 'position:absolute;z-index:20;left:245px;top:145px;width:1110px;background:#d6c49c;box-shadow:0 10px 36px #000';
      document.getElementById('game').contentDocument.body.appendChild(host);
      G.ChartView.mount(host, { w:1100, h:550, center:[28.6,38.4], span:9 });
      setTimeout(function () { document.title = 'discovery done'; }, 900);
    }, 500);
  } catch (e) { document.title = 'discovery err ' + e.message; console.error(e); }
};
</script></body></html>
