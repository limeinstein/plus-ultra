<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script src="js/core/util.js"></script>
<script src="js/data/base.js"></script>
<script src="js/data/cities.js"></script>
<script src="js/art/paint.js"></script>
<script src="js/art/city.js"></script>
<script src="js/art/portrait.js"></script>
<script src="js/art/interior.js"></script>
<script>
const q=new URLSearchParams(location.search);
window.onload=()=>{ try{
  const kinds=(q.get('k')||'tavern,trade,library,church').split(',');
  const cities=(q.get('c')||'0').split(',').map(Number);
  const ctx=document.getElementById('c').getContext('2d');
  const n=kinds.length, cols=n>1?2:1, rows=Math.ceil(n/cols), w=1600/cols, h=900/rows;
  const t0=performance.now();
  kinds.forEach((k,i)=>{ const city=G.CITY_DATA[cities[i%cities.length]]; const im=G.Art.interior(k,city); ctx.drawImage(im,(i%cols)*w,Math.floor(i/cols)*h,w,h); });
  document.title='done '+(performance.now()-t0).toFixed(0);
 }catch(e){document.title='err '+e.message;console.error(e)} };
</script></body></html>
