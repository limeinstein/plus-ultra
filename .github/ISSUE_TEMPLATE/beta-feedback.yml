name: "베타 피드백"
description: "공개 베타판의 오류, 어색한 점, 개선 아이디어를 남깁니다."
title: "[베타] "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        공개 베타 항해에 참여해 주셔서 고맙습니다. 문제를 다시 확인할 수 있도록 아래 항목을 적어 주세요.
  - type: dropdown
    id: kind
    attributes:
      label: 피드백 종류
      options:
        - 오류·작동 문제
        - 그림·움직임 문제
        - 화면·조작 불편
        - 게임 균형 의견
        - 내용·문장 제안
        - 그 밖의 아이디어
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 확인한 베타 버전
      description: 제목 화면에 표시된 VERSION 숫자를 적어 주세요.
      placeholder: "예: 0.256"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 사용 환경
      description: 기기, 운영체제, 브라우저를 적어 주세요.
      placeholder: "예: Windows 11 / Chrome, Galaxy S24 / Samsung Internet"
  - type: textarea
    id: what-happened
    attributes:
      label: 어떤 일이 있었나요?
      description: 기대한 결과와 실제 결과를 함께 적어 주세요.
      placeholder: "어느 화면에서 무엇을 했을 때 어떻게 보이거나 작동했는지 알려 주세요."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일어나는 순서
      description: 오류라면 문제를 다시 볼 수 있는 행동 순서를 적어 주세요.
      placeholder: |
        1. 새 게임을 시작한다
        2. 리스본 광장으로 간다
        3. ...
  - type: textarea
    id: extra
    attributes:
      label: 덧붙일 자료
      description: 화면 갈무리나 저장 자료가 있다면 끌어다 놓아 첨부해 주세요. 개인 정보는 지워 주세요.
