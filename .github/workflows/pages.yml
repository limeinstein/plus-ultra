# main은 정식판, beta는 공개 시험판으로 함께 만들어 GitHub Pages에 게시한다.
name: 정식·베타 웹 배포판 게시 (GitHub Pages)

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 정식판 소스 받기
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: 베타판 소스 받기
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: esbuild (코드 줄이기)
        run: npm install -g esbuild
      - name: 정식판 배포 노트 확인
        working-directory: stable
        run: python tools/web_release.py --check
      - name: 베타판 배포 노트 확인
        working-directory: beta
        run: python tools/web_release.py --check
      - name: 정식 웹 배포판 만들기
        working-directory: stable
        run: python tools/build_web.py --out "$GITHUB_WORKSPACE/site" --no-zip
      - name: 베타 웹 배포판 만들기
        working-directory: beta
        run: python tools/build_web.py --channel beta --out "$GITHUB_WORKSPACE/site/beta" --no-zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
