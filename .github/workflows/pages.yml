# main은 정식판, beta는 공개 시험판으로 함께 만들어 GitHub Pages에 게시한다.
name: 정식·베타 웹 배포판 게시 (GitHub Pages)

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
  schedule:
    # 한국 시간 11월 21일 0시 이후 게임 파일도 게시물에서 제거한다.
    # 정각 차단은 미리 배포한 브라우저 차단문이 담당하며 예약 지연에 의존하지 않는다.
    - cron: '2,17 15 20,21 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      closed: ${{ steps.check.outputs.closed }}
    steps:
      - id: check
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-20 15:00:00' +%s)" ]; then
            echo 'closed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'closed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: policy
    if: needs.policy.outputs.closed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 정식판 소스 받기
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 1
      - name: 베타판 소스 받기
        run: |
          git -C stable fetch --depth=1 origin beta
          git -C stable worktree add --detach "$GITHUB_WORKSPACE/beta" FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: esbuild (코드 줄이기)
        run: npm install -g esbuild
      - name: 정식판 배포 노트 확인
        working-directory: stable
        run: python tools/web_release.py --check
      - name: 베타판 배포 노트 확인
        working-directory: beta
        run: python tools/web_release.py --check
      - name: 정식 웹 배포판 만들기
        working-directory: stable
        run: python tools/build_web.py --out "$GITHUB_WORKSPACE/site" --no-zip --image-base "https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/images/"
      - name: 베타 웹 배포판 만들기
        working-directory: beta
        run: python tools/build_web.py --channel beta --out "$GITHUB_WORKSPACE/site/beta" --no-zip --image-base "https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/images/"
      - name: 정식·베타 공용 자산 중복 제거
        run: python stable/tools/share_pages_assets.py --site "$GITHUB_WORKSPACE/site"
      - name: 게시 용량 확인
        run: python stable/tools/check_pages_size.py "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  close:
    needs: policy
    if: needs.policy.outputs.closed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/legacy-closed.html
          sparse-checkout-cone-mode: false
      - name: 기존 주소에서 게임 파일을 빼고 종료 안내만 게시
        run: |
          mkdir -p site/beta/center
          for page in index.html catalog.html closed.html 404.html beta/index.html beta/catalog.html beta/closed.html beta/center/index.html; do
            cp web/legacy-closed.html "site/$page"
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [build, close]
    if: ${{ always() && (needs.build.result == 'success' || needs.close.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
