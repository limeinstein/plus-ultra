<h1>선박 미술 · 추가 보강 전후</h1>
<p>36종의 돛에 입체 테두리 밧줄·보강천·잔주름을 더하고, 갑판 해치의 깊이와 닻줄 설비를 보강했습니다. 선종에 맞춰 타·조타 손잡이, 지붕의 처마와 문틀, 거북선 등판 이음도 다듬었습니다.</p>
<nav><a href="../../test_ships_3d.html">36종 직접 돌려 보기</a><label>선박 묶음 <select id="group"><option value="1">서양 범선 9종</option><option value="2">갤리온·갤리 9종</option><option value="3">지중해·인도양·동남아 9종</option><option value="4">동아시아·발사 9종</option></select></label>
<label for="split">추가 보강 표시 <input id="split" type="range" min="0" max="100" value="50"><output id="amount">50%</output></label></nav>
<div class="key"><span>← 이번 보강 후</span><span>이전 보강 결과 →</span></div>
<figure aria-label="같은 방향과 조명으로 촬영한 선박 미술 보강 전후"><img id="before" alt="추가 보강 전 선박 9종"><img id="after" alt="추가 보강 후 같은 선박 9종"><div id="divider"></div></figure>

</main><script>
(function(){'use strict';var group=document.getElementById('group'),split=document.getElementById('split');
