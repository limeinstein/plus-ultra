<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해전 물보라 7종</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1c29;color:#e8e1cd;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0;color:#f1d7a3}p{color:#9ebbc9;margin:4px 0 20px}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}input,select{accent-color:#b8e7ec}select{background:#213b4d;color:#eee;padding:5px;border:1px solid #547382;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#183348;border:1px solid #365769;border-radius:10px;overflow:hidden}h2{font-size:17px;margin:10px 15px 0}canvas{display:block;width:100%;height:auto}footer{padding:0 15px 12px;font-size:13px}a{color:#9edbe6;margin-right:12px}small{display:block;color:#a7bfca}#status{color:#b9d6d9}input[type=range]{width:200px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}
</style></head><body><main><h1>물결 너머의 충격</h1><p>해전 물보라 7종 · 투명 8프레임 · 256 × 256칸</p>
<nav><label><input id="paused" type="checkbox"> 멈춤</label><label>장면 <input id="phase" type="range" min="0" max="1" step="0.001" value="0.35"></label><label>공격 방향 <select id="angle"><option value="0">오른쪽 →</option><option value="1.57">아래 ↓</option><option value="3.14">왼쪽 ←</option><option value="4.71">위 ↑</option></select></label><span id="status">불러오는 중…</span></nav>
<div class="grid" id="cards"></div><p>포탄 착수·선체 피격은 일반 해전에도 적용합니다. 괴물의 사방 포격·돌진·충돌·잠수·재등장은 동작마다 다른 물보라를 씁니다.</p></main>
<script src="images/manifest.js"></script><script src="js/core/images.js"></script><script src="js/data/seafx.js"></script><script src="js/art/watersplash.js"></script>
<script>
(function(){'use strict';var cfg=G.FX.waterSplash,ids=Object.keys(cfg.types),views=[],elapsed=0,previous=null;
ids.forEach(function(id){var c=cfg.types[id],card=document.createElement('article');card.innerHTML='<h2>'+c.name+'</h2><canvas width="640" height="440"></canvas><footer><a href="images/effects/water/'+id+'.webp" download>WebP 시트</a><a href="art_sources/water-splashes/sheets/'+id+'.png" download>PNG 시트</a><small>'+c.life+'초 · '+(c.under?'수면 위, 대상 아래':'대상 앞에 튀는 물')+'</small></footer>';document.getElementById('cards').appendChild(card);views.push({id:id,ctx:card.querySelector('canvas').getContext('2d')});});
function draw(phase){views.forEach(function(v){var c=cfg.types[v.id],ctx=v.ctx;ctx.save();ctx.scale(2,2);ctx.clearRect(0,0,320,220);ctx.fillStyle='#183348';ctx.fillRect(0,0,320,220);ctx.strokeStyle='rgba(160,219,230,.07)';for(var i=0;i<7;i++){ctx.beginPath();ctx.moveTo(0,35+i*25);ctx.lineTo(320,35+i*25);ctx.stroke();}G.WaterSplash.draw(ctx,{style:v.id,t:phase*c.life,life:c.life,size:260,angle:Number(document.getElementById('angle').value)},160,162);ctx.restore();});}
document.getElementById('phase').oninput=function(){document.getElementById('paused').checked=true;draw(Number(this.value));};
function loop(t){if(previous!=null&&!document.getElementById('paused').checked){elapsed+=Math.min(.1,(t-previous)/1000);document.getElementById('phase').value=elapsed%2/2;}previous=t;draw(Number(document.getElementById('phase').value));requestAnimationFrame(loop);}
G.WaterSplash.preload().then(function(){window.SPLASH_PREVIEW={ready:ids.every(function(id){return G.WaterSplash.status(id)==='ok';}),draw:draw};document.getElementById('status').textContent=ids.filter(function(id){return G.WaterSplash.status(id)==='ok';}).length+' / 7종 준비';requestAnimationFrame(loop);});
})();
</script></body></html>
