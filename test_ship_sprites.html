<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8방향 동작 선박 스프라이트 확인</title>
<style>html,body{margin:0;background:#17212a;color:#eadfc7;font:14px sans-serif}header{position:sticky;top:0;z-index:2;background:#111b;padding:10px 16px}canvas{display:block;width:100%;height:auto}</style></head>
<body><header>36종 8방향 회전 · 표류/질주/정박 동작 · 클릭하면 다음 동작</header><canvas id="c" width="1440" height="1320"></canvas>
<script src="js/core/util.js"></script><script src="images/manifest.js"></script><script src="js/core/images.js"></script>
<script src="js/data/ships.js"></script><script src="js/data/shipart.js"></script><script src="js/data/seafx.js"></script>
<script src="js/art/paint.js"></script><script src="js/art/ships.js"></script><script src="js/art/shipsprite.js"></script>
<script>
(function(){'use strict';var c=document.getElementById('c'),x=c.getContext('2d'),mode=0,t0=performance.now();c.onclick=function(){mode=(mode+1)%3;};
var showcase=['galleon','galley','dhow','junk','panokseon','balsa'];
G.ShipSprite.preload(showcase,20000).then(function(){G.ShipSprite.want(G.SHIP_TYPES.map(function(s){return s.id;}));requestAnimationFrame(loop);});
function loop(now){var t=(now-t0)/1000;x.clearRect(0,0,c.width,c.height);x.fillStyle='#284f67';x.fillRect(0,0,c.width,c.height);
G.SHIP_TYPES.forEach(function(s,i){var col=i%6,row=Math.floor(i/6),cx=120+col*240,cy=98+row*215,ang=t*.35+i*.47;
x.save();x.fillStyle='rgba(8,16,24,.42)';x.fillRect(cx-110,cy-80,220,172);x.restore();
var rig={brace:Math.sin(t*.7+i)*.7,lee:Math.sin(t*.55+i)>0?1:-1,luff:.12+.12*Math.sin(t*2+i),fill:.9,wind:Math.sin(t*.2),aws:.8};
var look=G.Art.shipLook(s.id,{rig:rig,furl:mode===2?1:0,flag:'#d8b24c'});look.motion=mode===1?'dash':'drift';look.motionRate=mode===1?1.15:1;look.noWake=true;
G.Art.shipTop(x,cx,cy+25,ang,142,look,t+i);
x.fillStyle='#f3ead6';x.textAlign='center';x.fillText(s.name+' · '+s.id,cx,cy+102);});requestAnimationFrame(loop);} })();
</script></body></html>
