<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222}canvas{display:inline-block;margin:4px}</style></head>
<body><div id="d"></div>
<script src="js/core/util.js"></script>
<script src="js/art/paint.js"></script>
<script src="js/art/portrait.js"></script>
<script>
window.onload=()=>{ try{
 const roles=[['king','ib'],['pope','it'],['priest','ne'],['noble','it'],['merchant','is'],['scholar','ne'],['keeper','ib'],['sailor','ib'],['soldier','ib'],['maid','ib'],['maid','is'],['native','az'],['king','is'],['merchant','cn'],['king','jp'],['sailor','af'],['scholar','in'],['maid','jp']];
 const d=document.getElementById('d');
 roles.forEach((r,i)=>{ const c=G.Art.portraitCanvas(G.Art.npcSpec('p'+i,r[0],r[1]),180); d.appendChild(c); });
 document.title='done';
}catch(e){document.title='err '+e.message;console.error(e)} };
</script></body></html>
